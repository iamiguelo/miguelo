<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>miguelo · Creative AI &amp; Ecommerce Strategist</title>
<meta name="description" content="Miguelo, Creative AI & Ecommerce Strategist. Contacto: hola@miguelo.com · 655 207 958.">
<meta name="theme-color" content="#FF3919">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:title" content="miguelo">
<meta property="og:description" content="Creative AI & Ecommerce Strategist">
<meta property="og:image" content="https://miguelo.com/assets/miguelo-logo-naranja.png">
<meta property="og:url" content="https://miguelo.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
body{margin:0}

/* Layout: vídeo a sangre arriba, pasos, tarjeta de reserva en dos columnas que se apilan en móvil, pie naranja */
:root{
  --orange:#FF3919; --orange-ink:#C42A0E; --sun:#FFC93C;
  --bg:#FFF6EE; --card:#FFFFFF; --soft:#FFF6EE; --fg:#1F1410; --muted:#5A4A43; --line:#EADFD6;
  --stage:#1F1410;
  --display:"Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17100D; --card:#221915; --soft:#2C211C; --fg:#FFF1E6; --muted:#CDBBB1; --line:#3E302A; --orange-ink:#FF6B4F; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17100D; --card:#221915; --soft:#2C211C; --fg:#FFF1E6; --muted:#CDBBB1; --line:#3E302A; --orange-ink:#FF6B4F; color-scheme:dark}

*{box-sizing:border-box}
html{height:100%}
body{height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:8px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}

/* HERO: pantalla completa. Vídeo entero (contain) y el hueco sobrante toma el color de fondo del vídeo en cada momento */
.hero{position:relative;width:100%;flex:1 1 auto;min-height:0;background:#FFFFFF;overflow:hidden}
.hero.live .stage{display:none}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--orange)}
.stage .rings{position:absolute;left:50%;top:50%;width:0;height:0}
.stage .rings i{position:absolute;left:0;top:0;border:3px solid rgba(255,255,255,.55);border-radius:50%;transform:translate(-50%,-50%);width:40px;height:40px;animation:ring 4.8s cubic-bezier(.2,.7,.3,1) infinite;opacity:0}
.stage .rings i:nth-child(2){animation-delay:1.2s}.stage .rings i:nth-child(3){animation-delay:2.4s}.stage .rings i:nth-child(4){animation-delay:3.6s}
@keyframes ring{0%{width:40px;height:40px;opacity:.9}100%{width:1800px;height:1800px;opacity:0}}
.stage .biglogo{width:min(70vw,760px);animation:pop 1.1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(.6) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.vid{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s}
.vid.ok{opacity:1}
.vid.fg{object-fit:contain}
.scroll{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#1F1410;background:rgba(255,255,255,.7);text-decoration:none;animation:hint 2.4s ease-in-out infinite;z-index:2}
@keyframes hint{50%{transform:translate(-50%,6px)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;border:0;font-family:var(--display);font-weight:600;font-size:19px;text-decoration:none;cursor:pointer;transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn-white{background:#fff;color:#1F1410}
.btn-ink{background:#1F1410;color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

.intro{padding-block:72px 8px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:28px}
.intro .left{display:flex;flex-direction:column;gap:18px;align-items:flex-start;flex:1 1 480px;min-width:0}
.intro .right{display:flex;flex-direction:column;gap:20px;align-items:flex-start;flex:0 1 380px;min-width:0}
.intro h1 em{font-style:normal;color:var(--orange-ink)}
.tag{background:var(--sun);color:#1F1410;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;border-radius:999px;transform:rotate(-3deg)}
.intro h1{font-size:clamp(46px, 8vw, 104px);line-height:.95;letter-spacing:-.02em;font-weight:700;max-width:12ch}
.intro p{margin:0;color:var(--muted);font-size:clamp(17px,2vw,21px);max-width:34ch}

.badge{position:absolute;z-index:3;right:max(24px, env(safe-area-inset-right, 0px));bottom:-60px;width:150px;height:150px;border-radius:50%;background:var(--sun);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:700px){.badge{width:100px;height:100px;bottom:-44px}}

/* PASOS */
.steps{padding-block:72px 32px}
.steps h2{font-size:clamp(38px,5vw,60px);margin-bottom:36px}
.steps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.step{background:var(--card);border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:10px}
.step:nth-child(2){transform:rotate(-1.2deg)}
.step:nth-child(3){background:var(--sun);color:#1F1410}
.step .n{font-family:var(--display);font-weight:700;font-size:60px;line-height:1;color:var(--orange)}
.step:nth-child(3) .n{color:#1F1410}
.step h3{font-size:26px;font-weight:600}
.step p{margin:0;color:var(--muted)}
.step:nth-child(3) p{color:#3A2C26}

/* CITA */
.book{padding-block:64px 104px}
.card{background:var(--card);border-radius:36px;padding:clamp(22px,4vw,52px);display:flex;flex-direction:column;gap:36px}
.card-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.card-head h2{font-size:clamp(38px,5vw,60px)}
.card-head p{margin:0;color:var(--muted);max-width:40ch}
.cols{display:flex;flex-wrap:wrap;gap:36px}
.col{flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:16px}
.col h3{font-size:24px;font-weight:600}

.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.type{position:relative;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px;cursor:pointer;color:var(--fg);font-family:var(--body);transition:transform .15s, border-color .15s}
.type:hover{transform:translateY(-3px)}
.type .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.type b{font-family:var(--display);font-weight:600;font-size:21px}
.type span{font-size:14px;color:var(--muted)}
.type .min{position:absolute;top:16px;right:16px;font-family:var(--display);font-weight:600;font-size:14px;background:var(--card);border-radius:999px;padding:4px 10px;color:var(--fg)}
.type[aria-checked="true"]{border-color:var(--orange);background:var(--card);box-shadow:0 8px 0 var(--orange)}
.type[aria-checked="true"] .min{background:var(--orange);color:#fff}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--fg);font-family:var(--display);font-weight:500;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .12s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#1F1410;transform:rotate(-2deg)}
.chip[aria-pressed="true"]::before{content:"";width:8px;height:8px;border-radius:50%;background:#1F1410}

.hours{display:flex;flex-direction:column;gap:12px}
.hours small{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hgrid button{min-height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.hgrid button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.hint{margin:0;font-size:14px;color:var(--muted)}
.days button.wkend{opacity:.3;cursor:default;background:transparent}

.sheet{display:flex;flex-direction:column;align-items:center;background:#fff;color:#1F1410;border-radius:22px;overflow:hidden;width:150px;box-shadow:0 10px 0 rgba(0,0,0,.15);transform:rotate(-4deg)}
.sheet .m{background:#1F1410;color:#fff;width:100%;text-align:center;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;padding:8px 0}
.sheet .d{font-family:var(--display);font-weight:700;font-size:68px;line-height:1;padding:10px 0 2px}
.sheet .h{font-family:var(--display);font-weight:600;font-size:18px;padding-bottom:12px;color:#C42A0E}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:15px}
.field.wide{grid-column:1/-1}
input,textarea{font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:14px;min-height:50px;padding:0 14px}
textarea{padding:12px 14px;min-height:90px;resize:vertical}
input:focus,textarea:focus{border-color:var(--orange);outline:none}
.err{color:var(--orange-ink);font-size:14px;font-weight:500;min-height:1em}

.summary{background:#1F1410;color:#fff;border-radius:26px;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.summary small{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--sun);font-weight:700}
.summary strong{font-family:var(--display);font-weight:600;font-size:clamp(18px,2.4vw,24px)}
.summary .btn{min-height:60px;font-size:21px}

.done{background:var(--orange);color:#fff;border-radius:30px;padding:clamp(32px,6vw,64px) 24px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.done .tick{width:88px;height:88px;border-radius:50%;background:#fff;display:grid;place-items:center;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.done h3{font-size:clamp(34px,5vw,50px);font-weight:700}
.done p{margin:0;max-width:46ch}
.done pre{white-space:pre-wrap;text-align:left;background:rgba(0,0,0,.18);border-radius:16px;padding:16px 18px;margin:0;font:inherit;font-size:15px;max-width:520px;width:100%;user-select:all}
.done .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn-ghost{background:transparent;color:#fff;border:2px solid #fff}

footer{flex:none;background:var(--orange);color:#fff}
footer .wrap{max-width:none;padding-block:18px;display:flex;justify-content:space-between;align-items:center;gap:10px 28px;flex-wrap:wrap}
footer img{height:30px;width:auto;display:block}
footer .brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
footer .role{font-size:12px;letter-spacing:.22em;text-transform:uppercase}
footer .contact{display:flex;gap:6px 24px;flex-wrap:wrap;font-family:var(--display);font-weight:600;font-size:19px}
@media (max-width:600px){footer .wrap{padding-block:16px;flex-direction:column;justify-content:center;text-align:center;gap:10px}footer .brand{flex-direction:column;gap:6px}footer .role{font-size:11px;letter-spacing:.16em}footer .contact{justify-content:center;font-size:17px;gap:4px 18px}}
footer .contact a{text-decoration:none;user-select:all}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<header class="hero" id="hero">
  <div class="stage" aria-hidden="true">
    <div class="rings"><i></i><i></i><i></i><i></i></div>
    <img class="biglogo" src="assets/miguelo-logo-blanco.png" alt="">
  </div>
  <video class="vid fg" id="vfg" muted loop playsinline preload="auto" aria-hidden="true"></video>
</header>



<footer id="contacto">
  <div class="wrap">
    <div class="brand"><img src="assets/miguelo-logo-blanco.png" alt="miguelo"><span class="role">Creative AI &amp; Ecommerce Strategist</span></div>
    <div class="contact"><a href="mailto:hola@miguelo.com">hola@miguelo.com</a><a href="tel:+34655207958">655.207.958</a></div>
  </div>
</footer>

<script>
(function(){
  var hero=document.getElementById('hero'), v=document.getElementById('vfg');
  var mq=window.matchMedia('(orientation: portrait)'), cur='';
  var cv=document.createElement('canvas'); cv.width=cv.height=1;
  var cx=cv.getContext('2d',{willReadFrequently:true});
  function pick(){
    var src=mq.matches?'video/miguelo-blanco-9x16.mp4':'video/miguelo-blanco-16x9.mp4';
    if(src===cur) return; cur=src;
    v.classList.remove('ok'); v.src=src; v.load();
    v.oncanplay=function(){v.oncanplay=null;
      var p=v.play(); if(p&&p.then)p.then(on,function(){}); else on();};
  }
  function on(){v.classList.add('ok');hero.classList.add('live');loop();}
  // toma el color de la esquina del vídeo para rellenar el espacio sobrante
  function sample(){
    try{cx.drawImage(v,2,2,4,4,0,0,1,1);var d=cx.getImageData(0,0,1,1).data;
      hero.style.backgroundColor='rgb('+d[0]+','+d[1]+','+d[2]+')';}catch(e){}
  }
  var raf=0,last=0;
  function loop(){cancelAnimationFrame(raf);(function f(t){if(t-last>40){sample();last=t;}raf=requestAnimationFrame(f);})(0);}
  if(mq.addEventListener)mq.addEventListener('change',pick);else mq.addListener(pick);
  pick();
})();
</script>
</body>
</html>
