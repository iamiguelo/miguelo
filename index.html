<style>
:root{--rojo:#FE3719;--tinta:#1d1d1f;--papel:#fbfaf8;--crema:#FFF6EE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Poppins",system-ui,-apple-system,sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased;overflow:hidden;
  background:radial-gradient(ellipse at 50% 42%,#ffffff 0%,var(--crema) 55%,#f3e6da 100%);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:inherit;text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* resplandor suave detrás de la tarjeta */
body::before{content:"";position:fixed;left:50%;top:46%;width:min(120vw,900px);aspect-ratio:1;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(254,55,25,.16) 0%,rgba(254,55,25,0) 62%);pointer-events:none;z-index:0}

/* tamaño: ancha en móvil, sin pasarse de alto en pantallas apaisadas */
.escena{position:relative;z-index:1;width:min(92vw,680px,calc((100dvh - 170px) * 85 / 55));perspective:1600px;
  animation:entrada 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes entrada{from{opacity:0;transform:translateY(24px) scale(.96)}}
.inclina{transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.flota{transform-style:preserve-3d;animation:flota 6s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-8px)}}

.tarjeta{position:relative;width:100%;aspect-ratio:85/55;cursor:pointer;transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.2,.8,.2,1);-webkit-tap-highlight-color:transparent;outline:none}
.tarjeta.girada{transform:rotateY(180deg)}
.tarjeta:focus-visible .cara{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--rojo)}

.cara{position:absolute;inset:0;container-type:inline-size;border-radius:clamp(10px,2.2vw,16px);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 50px 80px -35px rgba(120,30,0,.5),0 14px 28px -14px rgba(0,0,0,.25)}

/* cara roja: el vídeo del logo */
.delante{background:var(--rojo) url(video/miguelo-tarjeta-final.jpg) center/cover}
.delante video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.delante .tagline{position:absolute;left:0;right:0;bottom:21%;text-align:center;color:#fff;
  opacity:0;transform:translateY(8px);transition:opacity .8s ease,transform .8s ease}
.delante.listo .tagline{opacity:1;transform:none}
/* brillo que cruza la tarjeta al terminar el vídeo */
.delante::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);
  transform:translateX(-120%);pointer-events:none}
.delante.listo::after{animation:brillo 1.4s .3s ease-out}
@keyframes brillo{to{transform:translateX(120%)}}

/* cara blanca: contacto */
.detras{background:var(--papel);transform:rotateY(180deg);padding:7% 8%;display:flex;flex-direction:column;justify-content:center;gap:5%}
.detras img{width:46%;height:auto}
.detras .tagline{color:#3a3a3c}
.detras hr{border:0;height:2px;width:30%;background:var(--rojo)}
.detras a{pointer-events:none}
.tarjeta.girada .detras a{pointer-events:auto}
.tarjeta.girada .delante{pointer-events:none}

.tagline{font-size:clamp(8px,2.3cqw,14px);letter-spacing:.32em;text-transform:uppercase;font-weight:400;line-height:1.7}
.contacto{display:flex;flex-direction:column;gap:clamp(6px,2.4cqw,14px)}
.contacto a{display:inline-flex;align-items:center;gap:12px;font-size:clamp(13px,3.6cqw,20px);transition:color .2s;align-self:flex-start}
.contacto a:hover{color:var(--rojo)}
.contacto svg{width:clamp(16px,4cqw,22px);height:auto;flex:none;stroke:var(--rojo);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* debajo de la tarjeta */
.bajo{position:relative;z-index:1;margin-top:clamp(28px,6vh,56px);display:flex;flex-direction:column;align-items:center;gap:14px;min-height:72px}
.amago{transform-style:preserve-3d}
body.pide-toque .amago{animation:amago 2.4s cubic-bezier(.3,.7,.3,1) infinite}
@keyframes amago{0%,38%,70%,100%{transform:none}48%{transform:rotateY(-16deg) scale(.985)}58%{transform:rotateY(5deg)}}

/* dedito que toca la tarjeta */
.dedo{position:absolute;z-index:5;left:77%;top:80%;width:clamp(40px,13%,72px);pointer-events:none;opacity:0;transition:opacity .5s}
body.pide-toque .dedo{opacity:1}
.dedo .mano{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));transform-origin:46% 10%}
body.pide-toque .dedo .mano{animation:toque 2.4s cubic-bezier(.3,.7,.3,1) infinite}
@keyframes toque{0%{transform:translate(28%,34%) rotate(-8deg)}30%{transform:translate(0,0) rotate(-8deg)}40%{transform:translate(0,0) rotate(-8deg) scale(.82)}52%{transform:translate(0,0) rotate(-8deg) scale(1)}80%,100%{transform:translate(28%,34%) rotate(-8deg);opacity:1}}
.dedo .onda{position:absolute;left:46%;top:8%;width:120%;aspect-ratio:1;border-radius:50%;border:2.5px solid #fff;transform:translate(-50%,-50%) scale(0);opacity:0}
body.pide-toque .dedo .onda{animation:onda 2.4s ease-out infinite}
@keyframes onda{0%,39%{transform:translate(-50%,-50%) scale(0);opacity:0}41%{opacity:.95}75%,100%{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
.guardar{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rojo);border:1.5px solid var(--rojo);border-radius:999px;padding:9px 18px;
  opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s,background .2s,color .2s;pointer-events:none}
body.contacto-visible .guardar{opacity:1;transform:none;pointer-events:auto}
.guardar:hover{background:var(--rojo);color:#fff}

footer{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:11px;letter-spacing:.12em;color:#b3a398;z-index:1;transition:color 1.6s}

/* fondo generado con IA en cada visita (functions/bg.js); si no llega, se queda el fondo crema */
#fondo{position:fixed;inset:-8%;z-index:-1;background:center/cover no-repeat;filter:blur(22px) saturate(1.15);transform:scale(1.04);
  opacity:0;transition:opacity 1.8s ease,transform 6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
body.con-fondo #fondo{opacity:1;transform:none}
body.con-fondo footer{color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.35)}

@media (prefers-reduced-motion:reduce){
  .tarjeta,.inclina{transition:none}
  .escena,.flota,.delante.listo::after,body.pide-toque .amago,body.pide-toque .dedo .mano,body.pide-toque .dedo .onda{animation:none}
}
</style>

<body>

<script>
(function(){
  var tarjeta=document.getElementById('tarjeta'), delante=document.getElementById('delante'),
      video=document.getElementById('intro'), yaGirada=false,
      escena=document.getElementById('escena'), inclina=document.getElementById('inclina');

  function listo(){delante.classList.add('listo');
    // el dedito aparece hasta que la persona gira la tarjeta por primera vez
    if(!yaGirada&&!tarjeta.classList.contains('girada'))setTimeout(function(){if(!yaGirada)document.body.classList.add('pide-toque');},600);}
  function reproducir(){
    delante.classList.remove('listo');
    try{video.currentTime=0;}catch(e){}
    var p=video.play(); if(p&&p.catch)p.catch(listo); // si no deja reproducir, se ve la tarjeta terminada
  }
  video.addEventListener('ended',listo);
  video.addEventListener('error',listo);
  setTimeout(function(){if(!delante.classList.contains('listo'))listo();},8000);
  reproducir();

  function girar(){
    var volver=tarjeta.classList.contains('girada');
    tarjeta.classList.toggle('girada');
    document.body.classList.toggle('contacto-visible',!volver);
    yaGirada=true; document.body.classList.remove('pide-toque');
    if(volver)setTimeout(reproducir,450); // al volver a la cara roja, el logo se monta otra vez
  }
  tarjeta.addEventListener('click',function(e){if(!e.target.closest('a'))girar();});
  tarjeta.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();girar();}});

  // fondo con IA: una imagen nueva en cada visita (no en conexiones con ahorro de datos)
  (function(){
    var c=navigator.connection; if(c&&c.saveData)return;
    if(!window.fetch||!window.URL)return;
    fetch('/bg?'+Date.now(),{cache:'no-store'}).then(function(r){
      if(r.status!==200||(r.headers.get('Content-Type')||'').indexOf('image/')!==0)return;
      return r.blob().then(function(b){
        var url=URL.createObjectURL(b), img=new Image();
        img.onload=function(){document.getElementById('fondo').style.backgroundImage='url('+url+')';
          requestAnimationFrame(function(){document.body.classList.add('con-fondo');});};
        img.src=url;
      });
    }).catch(function(){});
  })();

  // en ordenador la tarjeta se inclina un poco siguiendo el ratón
  if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
    document.addEventListener('mousemove',function(e){
      var r=escena.getBoundingClientRect(),
          x=(e.clientX-(r.left+r.width/2))/window.innerWidth, y=(e.clientY-(r.top+r.height/2))/window.innerHeight;
      inclina.style.setProperty('--ry',(x*14).toFixed(2)+'deg');
      inclina.style.setProperty('--rx',(-y*10).toFixed(2)+'deg');
    });
    document.addEventListener('mouseleave',function(){inclina.style.setProperty('--ry','0deg');inclina.style.setProperty('--rx','0deg');});
  }
})();
</script>
